name: velie_app
description: "Velie - WhatsApp post scheduler powered by Calbrs Inc."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  go_router: ^14.6.2
  provider: ^6.1.2
  dio: ^5.7.0
  image_picker: ^1.1.2
  image_cropper: ^8.1.0
  image: ^4.3.0
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.3
  flutter_dotenv: ^5.2.1
  intl: 0.20.2
  flutter_svg: ^2.0.11
  video_player: ^2.14.0
  get_thumbnail_video:
    path: third_party/get_thumbnail_video
  path_provider: ^2.1.6
  file_picker: ^11.0.3
  audioplayers: ^6.8.1
  on_audio_query: 2.9.0
  permission_handler: 11.3.1
  ffmpeg_kit_flutter_audio: 6.0.3
  package_info_plus: ^9.0.1
  open_filex: ^4.7.0
  connectivity_plus: ^7.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# Vendored file_picker 11.0.3 with a patched Android build.gradle that applies
# KGP when AGP 9's built-in Kotlin is disabled (android.builtInKotlin=false),
# fixing "cannot find symbol FilePickerPlugin". See third_party/file_picker.
dependency_overrides:
  file_picker:
    path: third_party/file_picker
  # Vendored on_audio_query_android 1.1.0 with the same AGP 9 fix (its original
  # build.gradle pinned AGP 4.1.3 + Kotlin 1.6.10, which fails to compile the
  # plugin's Kotlin sources under AGP 9). See third_party/on_audio_query_android.
  on_audio_query_android:
    path: third_party/on_audio_query_android
  # Vendored ffmpeg_kit_flutter_audio 6.0.3 with its Android artifact swapped to
  # the maintained drop-in `dev.ffmpegkit-maintained:ffmpeg-kit-full-gpl` (same
  # com.arthenica.ffmpegkit API), because the original `com.arthenica` artifacts
  # were removed from Maven Central when ffmpeg-kit retired. The full-GPL build
  # bundles libx264 so status videos can be composed locally on-device (H.264,
  # H.265, mpeg4 encoding; overlay/scale/amix filters). See
  # third_party/ffmpeg_kit_flutter_audio.
  ffmpeg_kit_flutter_audio:
    path: third_party/ffmpeg_kit_flutter_audio
  # path_provider_android 2.3.x rebuilt the plugin as a Dart class on top of
  # package:jni (jnigen). Its JNI call during plugin registration crashes the
  # app at startup ("JNI is not initialized ... FindClassUnchecked" SIGSEGV, see
  # flutter/flutter#180102). Pinned to 2.2.5, the last method-channel build.
  path_provider_android: 2.2.5

flutter:
  generate: true
  uses-material-design: true
  assets:
    - .env
    - assets/icons/
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  web:
    generate: true
    image_path: "assets/images/app_icon.png"
    background_color: "#121212"
    theme_color: "#121212"
  image_path: "assets/images/app_icon.png"
  min_sdk_size: 21
  adaptive_icon_background: "#121212"
  adaptive_icon_foreground: "assets/images/app_icon.png"
